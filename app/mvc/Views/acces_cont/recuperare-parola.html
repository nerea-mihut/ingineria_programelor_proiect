<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Recuperare acces · M.E.S.H.</title>

    <link rel="stylesheet" href="css/acces_cont.css" />
    <script src="js/acces_cont.js" defer></script>
  </head>

  <body>
    <div class="layout">
      <header class="brand">
        <span class="logo" aria-hidden="true">
          <svg
            width="26"
            height="26"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <rect x="4" y="3" width="16" height="18" rx="2"></rect>

            <path d="M8 3v7h8V3M12 10v4M8 17h8"></path>
          </svg>
        </span>

        <div>
          <strong>M.E.S.H.</strong>
          <span>Mentenanță, Erori, Stocuri, Hală</span>
        </div>
      </header>

      <main class="card" aria-labelledby="recovery-title">
        <h1 id="recovery-title">Ai uitat parola?</h1>

        <p class="subtitle">
          Recuperare acces. Administratorul îți va da un link pentru o parolă
          nouă.
        </p>

        <form
          data-kind="recover"
          method="post"
          action="index.php?ruta=recuperare-parola"
        >
          <div class="field">
            <label for="email">Adresă de e-mail</label>

            <input
              id="email"
              name="email"
              type="email"
              placeholder="nume@exemplu.ro"
              autocomplete="email"
              maxlength="254"
              required
            />
          </div>

          <button class="primary" type="submit" disabled>
            Solicită resetarea
            <span aria-hidden="true">→</span>
          </button>
        </form>

        <p class="feedback" role="status" aria-live="polite" hidden></p>

        <div class="bottom">
          <a href="index.php?ruta=login"> Înapoi la autentificare </a>
        </div>

        <noscript>
          <p class="feedback">
            Activează JavaScript pentru a putea solicita resetarea parolei.
          </p>
        </noscript>
      </main>
    </div>
  </body>
</html>
