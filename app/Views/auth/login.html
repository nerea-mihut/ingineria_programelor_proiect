<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Autentificare · M.E.S.H.</title>
    <link rel="stylesheet" href="../../public/css/auth.css" />
    <script src="../../public/js/auth.js" defer></script>
  </head>
  <body>
    <div class="layout">
      <header class="brand">
        <span class="logo" aria-hidden="true"
          ><svg
            width="26"
            height="26"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <rect x="4" y="3" width="16" height="18" rx="2" />
            <path d="M8 3v7h8V3M12 10v4M8 17h8" /></svg
        ></span>
        <div>
          <strong>M.E.S.H.</strong><span>Mentenanță, Erori, Stocuri, Hală</span>
        </div>
      </header>
      <main class="card">
        <h1>Bine ai revenit!</h1>
        <p class="subtitle">Autentificare</p>
        <form data-kind="login" method="post">
          <div class="field">
            <label for="email">Adresă de e-mail</label
            ><input
              id="email"
              name="email"
              type="email"
              placeholder="nume@exemplu.ro"
              autocomplete="username"
              required
            />
          </div>
          <div class="field">
            <label for="password">Parolă</label
            ><input
              id="password"
              name="password"
              type="password"
              placeholder="Introdu parola"
              autocomplete="current-password"
              required
            />
          </div>
          <div class="options">
            <label class="check"
              ><input type="checkbox" data-passwords="password" />Arată
              parola</label
            ><a href="recuperare-parola.html">Am uitat parola</a>
          </div>
          <button class="primary" type="submit" disabled>
            Autentificare<span aria-hidden="true">→</span>
          </button>
        </form>
        <p class="feedback" role="status" aria-live="polite" hidden></p>
        <div class="bottom">
          Nu ai cont? <a href="creare-cont.html">Creează cont</a>
        </div>
        <noscript
          ><p class="feedback">
            Activează JavaScript pentru previzualizare. Formularele nu sunt
            conectate la server.
          </p></noscript
        >
      </main>
    </div>
  </body>
</html>
